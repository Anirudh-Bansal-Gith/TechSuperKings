<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="../css/complaint_form.css">
</head>
<body>
    
    <h2>Fill Complaint Details</h2>
    
    <form id="complaintForm">

        <div class="form-group">
            <label for="complaintTitle">Complaint Title:</label>
            <input type="text" id="complaintTitle" name="complaintTitle">
        </div>

        <br>

        <div class="form-group">
            <label for="complaintDescription">Complaint Description:</label>
            <textarea id="complaintDescription" name="complaintDescription" rows="15" cols="80" placeholder="Write Here"></textarea>
        </div>
        
        <br>

        <div class="form-group">
            <label for="file">Upload Supporting Files:</label>
            <input type="file" id="file" name="file" multiple accept="image/*,video/*,audio/*">
        </div>
        
        <br>

        <div class="form-group">
            <h4>Contact Information</h4>

            <label for="name">Enter Your Name:</label><br>
            <input type="text" id="name" name="name" placeholder="Your name" required><br>
            <label for="phone">Enter Your Phone Number:</label>
            <input type="tel" id="phone" name="phone" maxlength="10" pattern="[6-9][0-9]{9}" required> 
        </div>

        <div>

            <h4>Location (provide at least one)</h4>

            <button type="button" id="getLocation">📍 Use my current location</button>
            <p id="status"></p>

            <!-- hidden: filled only by GPS -->
            <input type="hidden" id="latitude" name="latitude">
            <input type="hidden" id="longitude" name="longitude">

            <p>— or —</p>

            <textarea id="address" name="address"
                placeholder="Full address"></textarea>

            <p id="error" style="color:red;"></p>

        </div>

        <div class="recorder-container">
            <div class="recorder-header">

                <span>Add voice description in your own language :</span>

                <div class="status-indicator"> 
                    <span id="pulseDot" class="pulse-dot" aria-hidden="true"></span>
                    <span id="statusText" role="status" aria-live="polite">Ready to record</span>
                </div>

                <time id="timer" class="timer" aria-label="Recording length" datetime="PT0S">00:00</time>

            </div>

    
    
            <div class="recorder-controls">

                <button type="button" id="startBtn" class="btn btn-primary">
                    <span aria-hidden="true">●</span> Record
                </button>

                <button type="button" id="pauseBtn" class="btn btn-secondary" disabled hidden>Pause</button>

                <button type="button" id="stopBtn" class="btn btn-danger" disabled>
                    <span aria-hidden="true">■</span> Stop
                </button>

                <button type="button" id="deleteBtn" class="btn btn-secondary" hidden>Retake</button>
                
            </div>
        
            <p id="errorText" class="recorder-error" role="alert" hidden></p>
        
            <audio id="audioPlayback" controls hidden aria-label="Voice note playback"></audio>
        </div>

        <br>

        <button type="submit">Submit Complaint</button>
    </form>

    <div id="response"></div>

    <script src="../script/complaint_form.js"></script>
    <script src="../script/voice_recorder.js"></script>
    <script src="../script/current_location.js"></script>
</body>
</html>
